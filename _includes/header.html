<header class="site-header">
  <div class="container header-inner">
    <a href="{{ '/' | relative_url }}" class="site-title" aria-label="{{ site.title }}, home">
      <span class="site-monogram" aria-hidden="true">NB</span>
      <span class="site-name">{{ site.title }}</span>
    </a>
    <nav class="site-nav" id="site-navigation" aria-label="Primary navigation">
      {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}" class="nav-link {% if page.title == item.title %}active{% endif %}" {% if page.title == item.title %}aria-current="page"{% endif %}>
          {{ item.title }}
        </a>
      {% endfor %}
    </nav>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-controls="site-navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<script>
  const navToggle = document.querySelector('.nav-toggle');
  const siteNav = document.querySelector('.site-nav');

  navToggle.addEventListener('click', function () {
    const isOpen = siteNav.classList.toggle('open');
    this.classList.toggle('open', isOpen);
    this.setAttribute('aria-expanded', isOpen);
  });

  document.querySelectorAll('[data-copy-email]').forEach(function (button) {
    button.addEventListener('click', async function () {
      const email = this.dataset.copyEmail;
      const label = this.querySelector('[data-copy-label]');
      let copied = false;

      try {
        await navigator.clipboard.writeText(email);
        copied = true;
      } catch (error) {
        const fallback = document.createElement('textarea');
        fallback.value = email;
        fallback.setAttribute('readonly', '');
        fallback.style.position = 'fixed';
        fallback.style.opacity = '0';
        document.body.appendChild(fallback);
        fallback.select();
        copied = document.execCommand('copy');
        fallback.remove();
      }

      if (copied) {
        label.textContent = 'Copied!';
        this.classList.add('is-copied');
        window.setTimeout(() => {
          label.textContent = 'Email';
          this.classList.remove('is-copied');
        }, 2000);
      }
    });
  });
</script>
